name: Lint and run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  lint-and-run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.15
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install .
      - name: Run lint
        run: |
          flake8 partner_tools
