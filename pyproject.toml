[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-partner-tools"
version = "0.2.0"
description = "SDK for interacting with the Microsoft Partner Center"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "TechStorm PC", email = "nathan@techstormpc.com" }]
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "click>=8.2,<9",
    "questionary>=2.1,<3",
    "requests>=2.32,<3",
    "azure-identity>=1.20,<2",
    "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/techstormpc/ms-partner-tools"

[project.scripts]
partnertools-cli = "partner_tools.cli.cli:main"

[dependency-groups]
dev = ["flake8>=7", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["partner_tools*"]

[tool.setuptools.package-data]
"partner_tools.data" = ["*.csv"]
